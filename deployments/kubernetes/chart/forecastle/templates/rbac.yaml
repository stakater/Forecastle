apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
{{ include "forecastle.labels.stakater" . | indent 4 }}
{{ include "forecastle.labels.chart" . | indent 4 }}
  {{- if .Values.forecastle.openshiftOauthProxy.enabled }}
  annotations:
{{ include "serviceaccount.redirectreference" . | indent 4 }}
    {{- if .Values.forecastle.openshiftOauthProxy.serviceAccountAnnotations }}
{{ toYaml .Values.forecastle.openshiftOauthProxy.serviceAccountAnnotations | indent 4}}
    {{- end }}
  {{- end }}
  name: {{ template "forecastle.name" . }}
  namespace: {{ include "forecastle.namespace" . }}
{{- if .Values.forecastle.rbac.create }}
{{- include "forecastle.rbac.validate" . }}
{{- if eq .Values.forecastle.rbac.scope "namespace" }}
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ template "forecastle.fullname" . }}-ingress-role
  namespace: {{ include "forecastle.namespace" . }}
  labels:
{{ include "forecastle.labels.stakater" . | indent 4 }}
{{ include "forecastle.labels.chart" . | indent 4 }}
rules:
{{ include "forecastle.rbac.rules" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ template "forecastle.fullname" . }}-ingress-role-binding
  namespace: {{ include "forecastle.namespace" . }}
  labels:
{{ include "forecastle.labels.stakater" . | indent 4 }}
{{ include "forecastle.labels.chart" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ template "forecastle.fullname" . }}-ingress-role
subjects:
- kind: ServiceAccount
  name: {{ template "forecastle.name" . }}
  namespace: {{ include "forecastle.namespace" . }}
{{- else }}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ template "forecastle.name" . }}-cluster-ingress-role
  labels:
{{ include "forecastle.labels.stakater" . | indent 4 }}
{{ include "forecastle.labels.chart" . | indent 4 }}
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]
{{ include "forecastle.rbac.rules" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ template "forecastle.name" . }}-cluster-ingress-role-binding
  labels:
{{ include "forecastle.labels.stakater" . | indent 4 }}
{{ include "forecastle.labels.chart" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ template "forecastle.name" . }}-cluster-ingress-role
subjects:
- kind: ServiceAccount
  name: {{ template "forecastle.name" . }}
  namespace: {{ include "forecastle.namespace" . }}
{{- end }}
{{- end }}
