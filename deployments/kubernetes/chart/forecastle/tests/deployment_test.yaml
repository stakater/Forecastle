suite: Deployment

templates:
  - deployment.yaml
  - configmap.yaml # dependency

tests:
  - it: includes pod security context when specified
    template: deployment.yaml
    set:
      forecastle.deployment.podSecurityContext:
        runAsNonRoot: true
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: includes forecastle container security context when specified
    template: deployment.yaml
    set:
      forecastle.deployment.securityContext:
        allowPrivilegeEscalation: false
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: includes forecastle container arg and specifies port when pprof is enabled
    template: deployment.yaml
    set:
      forecastle.deployment.pprof.enabled: true
      forecastle.deployment.pprof.port: 7070
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: --enable-pprof
      - equal:
          path: spec.template.spec.containers[0].args[1]
          value: --pprof-port=7070
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: pprof
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 7070

  - it: includes forecastle container args when specified
    template: deployment.yaml
    set:
      forecastle.deployment.args:
        - --cache-interval=45s
        - --port=8080
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: --cache-interval=45s
      - equal:
          path: spec.template.spec.containers[0].args[1]
          value: --port=8080

  - it: includes both custom args and pprof arg when specified together
    template: deployment.yaml
    set:
      forecastle.deployment.args:
        - --cache-interval=45s
      forecastle.deployment.pprof.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: --cache-interval=45s
      - equal:
          path: spec.template.spec.containers[0].args[1]
          value: --enable-pprof
      - equal:
          path: spec.template.spec.containers[0].args[2]
          value: --pprof-port=6060

  - it: renders startupProbe when enabled
    template: deployment.yaml
    set:
      forecastle.deployment.startupProbe:
        enabled: true
        failureThreshold: 60
        periodSeconds: 3
        successThreshold: 1
        timeoutSeconds: 4
        initialDelaySeconds: 7
        httpGet:
          path: /startup
          port: 8080
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            failureThreshold: 60
            periodSeconds: 3
            successThreshold: 1
            timeoutSeconds: 4
            initialDelaySeconds: 7
            httpGet:
              path: /startup
              port: 8080

  - it: renders livenessProbe when enabled
    template: deployment.yaml
    set:
      forecastle.deployment.livenessProbe:
        enabled: true
        failureThreshold: 5
        periodSeconds: 20
        successThreshold: 1
        timeoutSeconds: 6
        initialDelaySeconds: 15
        httpGet:
          path: /live
          port: 8080
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe
          value:
            failureThreshold: 5
            periodSeconds: 20
            successThreshold: 1
            timeoutSeconds: 6
            initialDelaySeconds: 15
            httpGet:
              path: /live
              port: 8080

  - it: renders readinessProbe when enabled
    template: deployment.yaml
    set:
      forecastle.deployment.readinessProbe:
        enabled: true
        failureThreshold: 4
        periodSeconds: 8
        successThreshold: 2
        timeoutSeconds: 3
        initialDelaySeconds: 10
        httpGet:
          path: /ready
          port: 8080
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            failureThreshold: 4
            periodSeconds: 8
            successThreshold: 2
            timeoutSeconds: 3
            initialDelaySeconds: 10
            httpGet:
              path: /ready
              port: 8080

