suite: HTTPRoute

templates:
  - httproute.yaml

tests:
  - it: should render nothing if not enabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should render an HTTPRoute when enabled
    set:
      forecastle.httpRoute.enabled: true
    asserts:
      - containsDocument:
          kind: HTTPRoute
          apiVersion: gateway.networking.k8s.io/v1
      - equal:
          path: metadata.name
          value: forecastle

  - it: should use the default backendRef when none is given
    set:
      forecastle.httpRoute.enabled: true
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: forecastle
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 80
      - equal:
          path: spec.rules[0].backendRefs[0].weight
          value: 1

  - it: should render custom backendRefs with correct nesting
    set:
      forecastle.httpRoute.enabled: true
      forecastle.httpRoute.rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: my-service
              port: 8080
              weight: 5
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: my-service
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 8080
      - equal:
          path: spec.rules[0].backendRefs[0].weight
          value: 5

  - it: should set parentRefs and hostnames when given
    set:
      forecastle.httpRoute.enabled: true
      forecastle.httpRoute.parentRefs:
        - name: my-gateway
      forecastle.httpRoute.hostnames:
        - forecastle.example.com
    asserts:
      - equal:
          path: spec.parentRefs[0].name
          value: my-gateway
      - equal:
          path: spec.hostnames[0]
          value: forecastle.example.com

  - it: should set the rule name when given
    set:
      forecastle.httpRoute.enabled: true
      forecastle.httpRoute.rules:
        - name: my-rule
          matches:
            - path:
                type: PathPrefix
                value: /
    asserts:
      - equal:
          path: spec.rules[0].name
          value: my-rule
